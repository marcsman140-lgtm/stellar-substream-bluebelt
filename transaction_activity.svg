<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#0f172a" rx="15"/>
  <text x="30" y="40" font-family="sans-serif" font-size="20" fill="#f8fafc" font-weight="bold">SubStream Protocol V2 - Transaction Volume (XLM)</text>
  <text x="30" y="65" font-family="sans-serif" font-size="14" fill="#94a3b8">Testnet Analytics - Last 30 Days</text>
  
  <!-- Grid Lines -->
  <line x1="50" y1="350" x2="550" y2="350" stroke="#334155" stroke-width="2" />
  <line x1="50" y1="275" x2="550" y2="275" stroke="#334155" stroke-width="1" stroke-dasharray="4" />
  <line x1="50" y1="200" x2="550" y2="200" stroke="#334155" stroke-width="1" stroke-dasharray="4" />
  <line x1="50" y1="125" x2="550" y2="125" stroke="#334155" stroke-width="1" stroke-dasharray="4" />
  
  <!-- Y Axis Labels -->
  <text x="40" y="355" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">0</text>
  <text x="40" y="280" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">5k</text>
  <text x="40" y="205" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">10k</text>
  <text x="40" y="130" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">15k</text>
  
  <!-- X Axis Labels -->
  <text x="50" y="375" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Week 1</text>
  <text x="216" y="375" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Week 2</text>
  <text x="383" y="375" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Week 3</text>
  <text x="550" y="375" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Week 4</text>
  
  <!-- Data Line -->
  <path d="M 50 340 Q 130 320 216 250 T 383 180 T 550 100" fill="none" stroke="#00d2ff" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Data Points -->
  <circle cx="50" cy="340" r="6" fill="#3b82f6" stroke="#0f172a" stroke-width="2"/>
  <circle cx="216" cy="250" r="6" fill="#3b82f6" stroke="#0f172a" stroke-width="2"/>
  <circle cx="383" cy="180" r="6" fill="#3b82f6" stroke="#0f172a" stroke-width="2"/>
  <circle cx="550" cy="100" r="6" fill="#3b82f6" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Tooltip Mock -->
  <rect x="470" y="50" width="100" height="40" fill="#1e293b" rx="5" stroke="#334155"/>
  <text x="520" y="75" font-family="sans-serif" font-size="14" fill="#10b981" text-anchor="middle" font-weight="bold">+ 342 Txns</text>
</svg>
